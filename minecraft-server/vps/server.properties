# Paper server config tuned for a small (~1 GB RAM) VPS.
# Full reference: https://minecraft.wiki/w/Server.properties

motd=A Paper Minecraft Server
server-port=25565

# Gameplay
gamemode=survival
difficulty=normal
hardcore=false
pvp=true
allow-nether=true
spawn-protection=16

# Players (kept modest for a small box)
max-players=8
online-mode=true
white-list=false
enforce-secure-profile=true

# World (lower distances = less RAM/CPU; raise if you upgrade the VPS)
level-name=world
level-seed=
view-distance=7
simulation-distance=5

# Admin
enable-command-block=false
enable-rcon=false

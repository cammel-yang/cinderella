# Easiest way to run the server: Docker + the well-maintained itzg image.
# It auto-downloads the correct Minecraft + Java for you.
#
#   docker compose up -d        # start in background
#   docker compose logs -f      # watch logs
#   docker attach minecraft     # open the server console (Ctrl-p Ctrl-q to detach)
#   docker compose down         # stop
#
# Docs: https://docker-minecraft-server.readthedocs.io/

services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"            # accepts https://aka.ms/MinecraftEULA
      TYPE: "VANILLA"
      VERSION: "LATEST"
      MEMORY: "2G"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "20"
      ONLINE_MODE: "TRUE"
      MOTD: "A Minecraft Server (cinderella)"
    volumes:
      - ./data:/data         # world + config persist here
    stdin_open: true
    tty: true
    restart: unless-stopped

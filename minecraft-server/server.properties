# Minecraft server configuration.
# The server regenerates/extends this file on first run.
# Full reference: https://minecraft.wiki/w/Server.properties

motd=A Minecraft Server (cinderella)
server-port=25565

# Gameplay
gamemode=survival
difficulty=normal
hardcore=false
pvp=true
allow-nether=true
spawn-protection=16

# Players
max-players=20
# Keep online-mode=true so only paid/genuine accounts can join.
online-mode=true
white-list=false
enforce-secure-profile=true

# World
level-name=world
level-seed=
view-distance=10
simulation-distance=10

# Admin
enable-command-block=false
enable-rcon=false
